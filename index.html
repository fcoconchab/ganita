<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Ganita</title>
    <meta name="description" content="Entrena cálculo mental hasta ser una calculadora humana." />
    <meta name="theme-color" content="#0d1420" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ganita" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Aplica el tema guardado antes de pintar, para que no parpadee.
      try {
        var raw = localStorage.getItem("ganita:v2") || localStorage.getItem("ganita:v1");
        var t = raw && JSON.parse(raw).settings && JSON.parse(raw).settings.theme;
        if (t === "oscuro") document.documentElement.dataset.theme = "dark";
        if (t === "claro") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
